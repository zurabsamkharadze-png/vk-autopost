<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GeoTrips VK Helper</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f5f7;color:#111;margin:0}
    main{max-width:840px;margin:30px auto;padding:18px}
    .card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
    .grid img{width:100%;height:220px;object-fit:cover;border-radius:12px;background:#eee}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
    button{border:0;border-radius:10px;padding:14px 18px;font-size:16px;cursor:pointer;background:#2688eb;color:#fff;font-weight:700}
    button.secondary{background:#4b5d6b}
    button:disabled{opacity:.55;cursor:not-allowed}
    .muted{color:#666;font-size:14px;line-height:1.5}
    .ok{color:#167c38;font-weight:700;white-space:pre-wrap;line-height:1.5}
    .err{color:#b3261e;white-space:pre-wrap;line-height:1.5}
    .steps{white-space:pre-wrap;background:#f7f8fa;border-radius:12px;padding:12px;margin-top:14px;font:14px/1.5 Arial,sans-serif}
    @media(max-width:640px){.grid{grid-template-columns:1fr}.grid img{height:240px}}
  </style>
</head>
<body>
<main><div class="card">
  <h1>GeoTrips VK Helper</h1>
  <p>Подготовка нескольких нативных фото для одного поста VK.</p>
  <p class="muted">Сейчас тестируем 4 реальные фотографии одной экскурсии Tripster: «Кахетия — родина вина, чачи и красоты!». Пост НЕ публикуется.</p>
  <p id="status" class="muted">Инициализация VK…</p>

  <div class="grid" id="gallery"></div>

  <div class="actions">
    <button id="uploadBtn" disabled>Загрузить 4 фото в VK</button>
    <button id="copyBtn" class="secondary" disabled>Скопировать attachments</button>
  </div>

  <div id="steps" class="steps">Ожидание…</div>
  <div id="result" class="ok" style="margin-top:16px"></div>
  <div id="error" class="err" style="margin-top:16px"></div>
</div></main>
<script>
const APP_ID=54792536;
const GROUP_ID=241800139;
const API_VERSION='5.199';
const UPLOAD_PROXY='https://eppyjmtowtkxcwwhvwzp.supabase.co/functions/v1/khashuri-bundle-check-v14';
const IMAGE_URLS=[
  'https://cdn.tripster.ru/photos/24f5f5d1-c62f-410a-9c57-d66e6114b578.jpg',
  'https://cdn.tripster.ru/photos/a8a2acaf-5c4b-467d-b767-642c89814e6c.jpg',
  'https://cdn.tripster.ru/photos/a0357964-fdf9-42cc-b203-a9f329c900ea.jpg',
  'https://cdn.tripster.ru/photos/ec146aca-a100-42b9-920a-72c90f67cf20.jpg'
];

const statusEl=document.getElementById('status');
const uploadBtn=document.getElementById('uploadBtn');
const copyBtn=document.getElementById('copyBtn');
const stepsEl=document.getElementById('steps');
const resultEl=document.getElementById('result');
const errorEl=document.getElementById('error');
const galleryEl=document.getElementById('gallery');
let lastAttachments=[];

galleryEl.innerHTML=IMAGE_URLS.map((u,i)=>`<img src="${u}" alt="Tripster фото ${i+1}">`).join('');

function step(text){stepsEl.textContent=text;}
function errText(e){
  if(e?.error_data?.error_reason)return e.error_data.error_reason;
  if(e?.error_data?.error_msg)return e.error_data.error_msg;
  if(e?.message)return e.message;
  return String(e);
}
async function api(method,token,params={}){
  const r=await vkBridge.send('VKWebAppCallAPIMethod',{method,params:{...params,access_token:token,v:API_VERSION}});
  return r?.response;
}
async function getToken(){
  const auth=await vkBridge.send('VKWebAppGetAuthToken',{app_id:APP_ID,scope:'photos'});
  if(!auth?.access_token)throw new Error('VK не вернул пользовательский токен');
  return auth.access_token;
}
async function uploadPhoto(token,imageUrl,index,total){
  step(`${index}/${total} — Получаем сервер загрузки VK…`);
  const server=await api('photos.getWallUploadServer',token,{group_id:GROUP_ID});
  if(!server?.upload_url)throw new Error('VK не вернул upload_url для фото '+index);

  step(`${index}/${total} — Передаём фото ${index} через сервер…`);
  const proxyResp=await fetch(UPLOAD_PROXY,{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({upload_url:server.upload_url,image_url:imageUrl})
  });
  const proxyData=await proxyResp.json().catch(()=>null);
  if(!proxyResp.ok || !proxyData?.ok){
    throw new Error('Фото '+index+': '+(proxyData?.error || ('HTTP '+proxyResp.status))+(proxyData?.message?' — '+proxyData.message:''));
  }
  const u=proxyData.uploaded;
  if(!u?.photo || u?.server===undefined || !u?.hash)throw new Error('VK вернул неполный ответ для фото '+index);

  step(`${index}/${total} — Сохраняем фото ${index} в VK…`);
  const saved=await api('photos.saveWallPhoto',token,{group_id:GROUP_ID,photo:u.photo,server:u.server,hash:u.hash});
  const photo=Array.isArray(saved)?saved[0]:null;
  if(!photo?.id)throw new Error('VK не вернул сохранённое фото '+index);
  return 'photo'+photo.owner_id+'_'+photo.id+(photo.access_key?'_'+photo.access_key:'');
}

async function init(){
  try{
    if(!window.vkBridge)throw new Error('VK Bridge не загрузился');
    await vkBridge.send('VKWebAppInit');
    statusEl.textContent='VK готов. Можно загрузить 4 фото.';
    uploadBtn.disabled=false;
  }catch(e){
    statusEl.textContent='Ошибка инициализации.';
    errorEl.textContent=errText(e);
  }
}

uploadBtn.addEventListener('click',async()=>{
  uploadBtn.disabled=true;copyBtn.disabled=true;resultEl.textContent='';errorEl.textContent='';lastAttachments=[];
  try{
    step('Получаем разрешение photos у VK…');
    const token=await getToken();
    for(let i=0;i<IMAGE_URLS.length;i++){
      const a=await uploadPhoto(token,IMAGE_URLS[i],i+1,IMAGE_URLS.length);
      lastAttachments.push(a);
    }
    step('Все 4 фотографии загружены. Пост не опубликован.');
    resultEl.textContent='Успех ✅\n\nAttachments для одного поста:\n'+lastAttachments.join(',');
    copyBtn.disabled=false;
    statusEl.textContent='Готово: 4 нативных фото подготовлены для одного поста.';
  }catch(e){
    statusEl.textContent='Загрузка остановлена.';
    errorEl.textContent='Ошибка: '+errText(e);
  }finally{
    uploadBtn.disabled=false;
  }
});

copyBtn.addEventListener('click',async()=>{
  if(!lastAttachments.length)return;
  const text=lastAttachments.join(',');
  try{
    await navigator.clipboard.writeText(text);
    copyBtn.textContent='Скопировано ✓';
    setTimeout(()=>copyBtn.textContent='Скопировать attachments',1600);
  }catch{
    resultEl.textContent+='\n\nНе удалось скопировать автоматически. Выдели строку выше вручную.';
  }
});

init();
</script>
</body></html>
