<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GeoTrips VK Helper</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f5f7;color:#111;margin:0}
    main{max-width:720px;margin:34px auto;padding:20px}
    .card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    button{border:0;border-radius:10px;padding:14px 18px;font-size:16px;cursor:pointer;background:#2688eb;color:#fff;font-weight:700}
    button:disabled{opacity:.55;cursor:not-allowed}
    .muted{color:#666;font-size:14px;line-height:1.5}
    .ok{color:#167c38;font-weight:700;white-space:pre-wrap}
    .err{color:#b3261e;white-space:pre-wrap;line-height:1.5}
    .steps{white-space:pre-wrap;background:#f7f8fa;border-radius:12px;padding:12px;margin-top:14px;font:14px/1.45 Arial,sans-serif}
  </style>
</head>
<body>
<main><div class="card">
  <h1>GeoTrips VK Helper</h1>
  <p>Новый тест без загрузки через браузер: пробуем скопировать уже загруженную в VK фотографию во внутренний альбом «Сохранённые фотографии».</p>
  <p class="muted">Пост НЕ публикуется. Токен нигде не показывается и никуда не отправляется.</p>
  <p id="status" class="muted">Инициализация VK…</p>
  <button id="testBtn" disabled>Проверить копирование фото внутри VK</button>
  <div id="steps" class="steps">Ожидание…</div>
  <div id="result" class="ok" style="margin-top:16px"></div>
  <div id="error" class="err" style="margin-top:16px"></div>
</div></main>
<script>
const APP_ID=54792536;
const API_VERSION='5.199';
const SOURCE_OWNER_ID=-241800139;
const SOURCE_PHOTO_ID=457239017;

const statusEl=document.getElementById('status');
const testBtn=document.getElementById('testBtn');
const stepsEl=document.getElementById('steps');
const resultEl=document.getElementById('result');
const errorEl=document.getElementById('error');

function step(text){stepsEl.textContent=text;}
function errText(e){
  if(e?.error_data?.error_reason)return e.error_data.error_reason;
  if(e?.error_data?.error_msg)return e.error_data.error_msg;
  if(e?.message)return e.message;
  return String(e);
}
async function api(method,token,params={}){
  const r=await vkBridge.send('VKWebAppCallAPIMethod',{method,params:{...params,access_token:token,v:API_VERSION}});
  return r?.response;
}

async function init(){
  try{
    if(!window.vkBridge)throw new Error('VK Bridge не загрузился');
    await vkBridge.send('VKWebAppInit');
    statusEl.textContent='VK готов.';
    testBtn.disabled=false;
  }catch(e){
    statusEl.textContent='Ошибка инициализации.';
    errorEl.textContent=errText(e);
  }
}

testBtn.addEventListener('click',async()=>{
  testBtn.disabled=true;resultEl.textContent='';errorEl.textContent='';
  try{
    step('1/3 — Запрашиваем разрешение photos у VK…');
    const auth=await vkBridge.send('VKWebAppGetAuthToken',{app_id:APP_ID,scope:'photos'});
    const token=auth?.access_token;
    if(!token)throw new Error('VK не вернул пользовательский токен');

    step('2/3 — Просим VK скопировать фото внутри своей системы…');
    const copiedId=await api('photos.copy',token,{owner_id:SOURCE_OWNER_ID,photo_id:SOURCE_PHOTO_ID});
    if(!copiedId)throw new Error('VK не вернул ID скопированной фотографии');

    step('3/3 — Проверяем результат…');
    resultEl.textContent='Успех ✅ VK скопировал фотографию без браузерной загрузки.\nНовый photo_id: '+copiedId+'\nПост не опубликован.';
    statusEl.textContent='Тест завершён успешно.';
    step('Все 3 шага выполнены.');
  }catch(e){
    statusEl.textContent='Тест остановлен.';
    errorEl.textContent='Ошибка: '+errText(e)+'\n\nПришли мне только этот текст ошибки. Токен нигде не показывается.';
  }finally{testBtn.disabled=false;}
});

init();
</script>
</body></html>
