name: VK Group Photo Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test photos.getWallUploadServer with community token
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: "241800139"
          VK_API_VERSION: "5.199"
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ.get("VK_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("RESULT=missing_group_token")

          payload = urllib.parse.urlencode({
              "group_id": os.environ["VK_GROUP_ID"],
              "access_token": token,
              "v": os.environ["VK_API_VERSION"],
          }).encode()
          req = urllib.request.Request(
              "https://api.vk.com/method/photos.getWallUploadServer",
              data=payload,
              method="POST",
              headers={"User-Agent": "GeoTrips-VK-Diagnostic/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode("utf-8"))

          if "error" in data:
              e = data["error"]
              print(f"RESULT=error code={e.get('error_code')} msg={e.get('error_msg')}")
          else:
              response = data.get("response") or {}
              print("RESULT=success upload_url_present=" + str(bool(response.get("upload_url"))).lower())
          PY
