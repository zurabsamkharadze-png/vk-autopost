name: VK Document Image Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-doc-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry Tripster image upload as VK document
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: "241800139"
          VK_API_VERSION: "5.199"
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import uuid

          token = os.environ["VK_ACCESS_TOKEN"].strip()
          group_id = int(os.environ["VK_GROUP_ID"])
          api_version = os.environ.get("VK_API_VERSION", "5.199")
          image_url = "https://resize.tripster.ru/5-Zb81g6rfGSGHysszr6G_pG-uI%3D/fit-in/800x600/filters%3Ano_upscale%28%29/https%3A//cdn.tripster.ru/photos/353a1b90-06fb-406c-81a5-e4a627761e0d.jpg"

          def vk(method, **params):
              payload = {**params, "access_token": token, "v": api_version}
              body = urllib.parse.urlencode(payload).encode("utf-8")
              req = urllib.request.Request(f"https://api.vk.com/method/{method}", data=body, headers={"User-Agent":"geotrips-vk-doc-photo-diagnostic/1.2"}, method="POST")
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if "error" in data:
                  err = data["error"]
                  raise RuntimeError(f"{method}: [{err.get('error_code')}] {err.get('error_msg')}")
              return data.get("response")

          def upload_file(url, content):
              boundary = "----GeoTripsVK" + uuid.uuid4().hex
              body = b"".join([
                  f"--{boundary}\r\n".encode(),
                  b'Content-Disposition: form-data; name="file"; filename="geotrips.jpg"\r\n',
                  b"Content-Type: image/jpeg\r\n\r\n",
                  content,
                  f"\r\n--{boundary}--\r\n".encode(),
              ])
              req = urllib.request.Request(url, data=body, headers={"Content-Type":f"multipart/form-data; boundary={boundary}","Content-Length":str(len(body)),"User-Agent":"geotrips-vk-doc-photo-diagnostic/1.2"}, method="POST")
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.loads(response.read().decode("utf-8"))

          image_req = urllib.request.Request(image_url, headers={"User-Agent":"Mozilla/5.0","Referer":"https://experience.tripster.ru/"})
          with urllib.request.urlopen(image_req, timeout=60) as response:
              image = response.read()
          print("Image bytes:", len(image))

          uploaded = None
          for attempt in range(1, 5):
              server = vk("docs.getWallUploadServer", group_id=group_id)
              upload_url = server["upload_url"]
              parsed = urllib.parse.urlparse(upload_url)
              print(f"Attempt {attempt} server:", parsed.netloc + parsed.path)
              uploaded = upload_file(upload_url, image)
              print(f"Attempt {attempt} response:", json.dumps(uploaded, ensure_ascii=False, sort_keys=True))
              if uploaded.get("file"):
                  break
              time.sleep(2)

          if not uploaded or not uploaded.get("file"):
              raise RuntimeError("All VK document upload attempts failed")

          saved = vk("docs.save", file=uploaded["file"], title="GeoTrips photo")
          print("DOCS_SAVE_RESPONSE=" + json.dumps(saved, ensure_ascii=False, sort_keys=True))
          doc = (saved or {}).get("doc") if isinstance(saved, dict) else None
          if not doc:
              raise RuntimeError("docs.save returned no doc")
          attachment = f"doc{doc['owner_id']}_{doc['id']}"
          if doc.get("access_key"):
              attachment += "_" + str(doc["access_key"])
          print("SUCCESS_DOC_ATTACHMENT=" + attachment)
          preview = ((doc.get("preview") or {}).get("photo") or {})
          print("DOC_HAS_PHOTO_PREVIEW=", bool(preview), "sizes=", len(preview.get("sizes") or []))
          PY
