name: VK Production Image Uploader Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test production image uploader without publishing a post
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_API_VERSION: "5.199"
        run: |
          python - <<'PY'
          import os
          from run_publisher import upload_wall_image_document
          token=os.environ['VK_ACCESS_TOKEN'].strip()
          image_url='https://resize.tripster.ru/5-Zb81g6rfGSGHysszr6G_pG-uI%3D/fit-in/800x600/filters%3Ano_upscale%28%29/https%3A//cdn.tripster.ru/photos/353a1b90-06fb-406c-81a5-e4a627761e0d.jpg'
          attachment=upload_wall_image_document(token,241800139,image_url,'GeoTrips automatic photo test')
          if not attachment.startswith('doc-241800139_'):
              raise RuntimeError('Unexpected attachment returned: '+attachment)
          print('SUCCESS_ATTACHMENT='+attachment)
          print('No VK wall post was created by this test.')
          PY
