name: Republish VK Post 5 With Photos

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish corrected VK post with native Tripster photos
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: "241800139"
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.parse, urllib.request

          API = "https://api.vk.com/method"
          VERSION = "5.199"
          token = os.environ["VK_ACCESS_TOKEN"].strip()
          group_id = int(os.environ["VK_GROUP_ID"])
          text_b64 = ""
          text = base64.b64decode(text_b64).decode("utf-8")
          attachments = ",".join([
              "photo200004513212_457239041_66cff3c6daea40d4f7",
              "photo200004513212_457239042_e90b5566f1862df69f",
              "photo200004513212_457239043_7399d0f47a7d944fcb",
          ])

          def vk(method, **params):
              payload = {**params, "access_token": token, "v": VERSION}
              data = urllib.parse.urlencode(payload, doseq=True).encode("utf-8")
              req = urllib.request.Request(f"{API}/{method}", data=data, headers={"User-Agent":"geotrips-vk-autopost/repost-with-photos"}, method="POST")
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = json.loads(r.read().decode("utf-8"))
              if "error" in body:
                  e = body["error"]
                  raise RuntimeError(f"VK API {method} failed: {e.get('error_code')} {e.get('error_msg')}")
              return body.get("response")

          guid = hashlib.sha256(b"colorful-georgia-native-3photos-2026-09-28-v2").hexdigest()[:32]
          result = vk("wall.post", owner_id=-group_id, from_group=1, message=text, attachments=attachments, guid=guid)
          print("Published corrected VK post:", result.get("post_id") if isinstance(result, dict) else result)
          PY
