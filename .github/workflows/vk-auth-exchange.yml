name: VK Server Token Exchange

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exchange VK authorization code
        env:
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_AUTH_CODE: ${{ secrets.VK_AUTH_CODE }}
          VK_GROUP_ID: "241800139"
          VK_API_VERSION: "5.199"
        run: python exchange_vk_user_token.py

      - name: Save encrypted user token
        shell: bash
        run: |
          if git diff --quiet -- vk_user_token.enc; then
            echo "Encrypted token file was not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_user_token.enc
          git commit -m "chore: store encrypted VK server user token"
          git push
