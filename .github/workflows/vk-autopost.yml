name: VK Autopost

on:
  workflow_dispatch:
  schedule:
    # Georgia time: 11:00 and 19:00 (UTC+4)
    - cron: "0 7,15 * * *"

permissions:
  contents: write

concurrency:
  group: vk-autopost
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish next queued post to VK
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: "241800139"
          VK_API_VERSION: "5.199"
        run: python run_publisher.py

      - name: Save queue state
        shell: bash
        run: |
          if git diff --quiet -- posts.json; then
            echo "Queue was not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "chore: mark VK post as published"
          git push
