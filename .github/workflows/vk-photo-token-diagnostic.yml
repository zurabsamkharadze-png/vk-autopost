name: VK Photo Token Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test community-token photo upload and scheduled wall attachment
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: "241800139"
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request, uuid

          token = os.environ.get('VK_ACCESS_TOKEN', '').strip()
          group_id = int(os.environ.get('VK_GROUP_ID', '').strip())
          image_url = 'https://resize.tripster.ru/5-Zb81g6rfGSGHysszr6G_pG-uI%3D/fit-in/800x600/filters%3Ano_upscale%28%29/https%3A//cdn.tripster.ru/photos/353a1b90-06fb-406c-81a5-e4a627761e0d.jpg'
          if not token:
              raise SystemExit('VK_ACCESS_TOKEN missing')

          def call(method, **params):
              payload = {**params, 'access_token': token, 'v': '5.199'}
              req = urllib.request.Request(
                  'https://api.vk.com/method/' + method,
                  data=urllib.parse.urlencode(payload).encode('utf-8'),
                  method='POST',
                  headers={'User-Agent':'geotrips-vk-diagnostic/1.0'},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode('utf-8'))
              if 'error' in data:
                  e=data['error']
                  raise RuntimeError(f'{method} error {e.get("error_code")}: {e.get("error_msg")}')
              return data.get('response')

          server = call('photos.getMessagesUploadServer', group_id=group_id)
          upload_url = server['upload_url']
          print('getMessagesUploadServer: OK')

          req = urllib.request.Request(image_url, headers={'User-Agent':'Mozilla/5.0','Referer':'https://experience.tripster.ru/'})
          with urllib.request.urlopen(req, timeout=45) as r:
              image_bytes = r.read()
              content_type = r.headers.get_content_type() or 'image/jpeg'
          print(f'image_download: OK bytes={len(image_bytes)} type={content_type}')

          boundary = '----GeoTrips' + uuid.uuid4().hex
          field_name = 'file1' if 'bulk_upload' in urllib.parse.urlparse(upload_url).path else 'photo'
          body = b''.join([
              f'--{boundary}\r\n'.encode(),
              f'Content-Disposition: form-data; name="{field_name}"; filename="tripster.jpg"\r\n'.encode(),
              f'Content-Type: {content_type}\r\n\r\n'.encode(),
              image_bytes,
              f'\r\n--{boundary}--\r\n'.encode(),
          ])
          up_req = urllib.request.Request(upload_url, data=body, method='POST', headers={
              'Content-Type':f'multipart/form-data; boundary={boundary}',
              'Content-Length':str(len(body)),
              'User-Agent':'geotrips-vk-diagnostic/1.0',
          })
          with urllib.request.urlopen(up_req, timeout=60) as r:
              uploaded = json.loads(r.read().decode('utf-8','replace'))
          print('upload: OK keys=' + ','.join(sorted(uploaded.keys())))

          saved = call('photos.saveMessagesPhoto', photo=uploaded['photo'], server=uploaded.get('server'), hash=uploaded.get('hash'))
          p=saved[0]
          attachment=f"photo{p['owner_id']}_{p['id']}"
          if p.get('access_key'):
              attachment += '_' + p['access_key']
          print('saveMessagesPhoto: OK attachment_ready=yes')

          result = call(
              'wall.post',
              owner_id=-group_id,
              from_group=1,
              message='GeoTrips automated photo diagnostic — scheduled test',
              attachments=attachment,
              publish_date=int(time.time()) + 86400,
              guid=uuid.uuid4().hex,
          )
          post_id = result.get('post_id') if isinstance(result,dict) else result
          print(f'wall.post scheduled: OK post_id={post_id}')
          call('wall.delete', owner_id=-group_id, post_id=post_id)
          print('wall.delete: OK scheduled test removed')
          print('RESULT: COMMUNITY_TOKEN_FULL_PHOTO_FLOW_WORKS')
          PY
