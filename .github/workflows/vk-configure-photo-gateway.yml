name: Configure VK Photo Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure protected VK client secret
        env:
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_GATEWAY_KEY: ${{ secrets.VK_GATEWAY_KEY }}
          VK_GATEWAY_URL: "https://eppyjmtowtkxcwwhvwzp.supabase.co/functions/v1/khashuri-bundle-check-v14"
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body=json.dumps({'action':'legacy_configure','client_secret':os.environ['VK_CLIENT_SECRET']}).encode()
          req=urllib.request.Request(os.environ['VK_GATEWAY_URL'],data=body,headers={'content-type':'application/json','authorization':'Bearer '+os.environ['VK_GATEWAY_KEY']},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.loads(r.read().decode('utf-8'))
          if not data.get('ok'):
              raise SystemExit('Gateway configuration failed')
          print('VK photo gateway configured successfully')
          PY
