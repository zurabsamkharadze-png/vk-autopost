name: VK Photo Capability Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test available VK user tokens for wall photo upload
        env:
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          VK_GROUP_ID: "241800139"
        run: |
          python - <<'PY'
          import os
          import run_publisher as rp

          group_id = int(os.environ["VK_GROUP_ID"])
          tests = []

          legacy = os.environ.get("VK_USER_TOKEN", "").strip()
          if legacy:
              tests.append(("legacy_secret", legacy))

          client_secret = os.environ.get("VK_CLIENT_SECRET", "").strip()
          try:
              encrypted = rp.decrypt_server_user_token(client_secret)
          except BaseException as exc:
              encrypted = ""
              print(f"encrypted_file: decrypt_failed {type(exc).__name__}")
          if encrypted:
              tests.append(("encrypted_file", encrypted))

          if not tests:
              raise SystemExit("No VK user token source is available")

          any_ok = False
          for label, token in tests:
              try:
                  result = rp.vk_call("photos.getWallUploadServer", token, group_id=group_id)
                  if isinstance(result, dict) and result.get("upload_url"):
                      print(f"{label}: VK_OK")
                      any_ok = True
                  else:
                      print(f"{label}: VK_UNEXPECTED")
              except Exception as exc:
                  msg = str(exc).replace(token, "***")
                  print(f"{label}: VK_ERROR {msg[:500]}")

          if not any_ok:
              raise SystemExit(2)
          PY
