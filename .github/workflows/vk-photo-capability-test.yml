name: VK Photo Capability Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test photos.getWallUploadServer with community token
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: "241800139"
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ.get("VK_ACCESS_TOKEN", "").strip()
          group_id = os.environ.get("VK_GROUP_ID", "").strip()
          if not token:
              raise SystemExit("VK_ACCESS_TOKEN is missing")

          payload = urllib.parse.urlencode({
              "access_token": token,
              "v": "5.199",
              "group_id": group_id,
          }).encode()
          req = urllib.request.Request(
              "https://api.vk.com/method/photos.getWallUploadServer",
              data=payload,
              method="POST",
              headers={"User-Agent": "GeoTrips-VK-Test/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode("utf-8"))

          if "error" in data:
              err = data["error"]
              print(f"VK_ERROR code={err.get('error_code')} msg={err.get('error_msg')}")
              raise SystemExit(2)

          result = data.get("response") or {}
          if result.get("upload_url"):
              print("VK_OK community token can obtain wall upload server")
          else:
              print("VK_UNEXPECTED no upload_url in response")
              raise SystemExit(3)
          PY
